<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__RESTAURANT_NAME__ — Reservation is Created</title>
    <!-- Link preview (WhatsApp / Instagram / Facebook).
         og:url and og:image MUST be absolute. A relative path here renders
         no preview at all: the crawler fetches the page from its own host
         and never resolves "/assets/...". Both are stamped in at build time
         from SITE_URL by build-config.js. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__RESTAURANT_NAME__" />
    <meta property="og:title" content="__RESTAURANT_NAME__ — Reservation is Created" />
    <meta
      property="og:description"
      content="Reservasi Anda sudah kami terima. Staff __RESTAURANT_NAME__ akan segera menghubungi Anda."
    />
    <meta property="og:url" content="__SITE_URL__/reservation-created" />
    <meta property="og:image" content="__SITE_URL__/assets/og-share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="assets/small-logo.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="assets/small-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&family=Montserrat:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        /* ── Brand tokens (2026-09-05). ONE PLACE. ───────────────────
           Every brand colour in the app resolves here. Before this, 728
           values were hardcoded across 20 files, which is why the colours
           could not be changed. Status colours (green, red, amber) are NOT
           here on purpose: they mean something and never follow the brand.

           --brand and --accent are the two a restaurant sets. Everything
           else is derived from them, and derived to PASS contrast rather
           than to look pleasant. Two of these fix long-standing failures:
           the old button blue (5596CE) under white text was 3.16:1 and the
           old gold (C8A96B) on cream was 2.08:1, against a 4.5 bar. */
        --brand: #5B4CBD;          /* primary fill. white on it: 6.54 */
        --brand-hover: #4A3DA3;    /* pressed/hover. white on it: 8.44 */
        --brand-ink: #4F41A8;      /* headings. on cream: 7.33, matched to the old navy */
        --brand-deep: #453897;     /* dark panels. on cream: 8.59 */
        --brand-deepest: #3C3084;  /* deepest. on cream: 9.99 */
        --brand-muted: #7565D6;    /* de-emphasised */
        --brand-soft: #A99BF0;     /* soft accents on dark */
        --brand-tint: #E4E0F8;     /* selected row / chip background */
        --brand-tint2: #F4F2FD;    /* faintest wash */
        --accent: #E24701;         /* FILLS ONLY. 3.79 on cream, so never small text */
        --accent-hover: #C63D01;   /* also the text-safe orange: 4.78 on cream */
        --accent-strong: #B23600;  /* 5.69 on cream */
        --accent-tint: #F7C9AF;
        --accent-tint2: #FBEDE4;
        /* RGB triplets for the few places that need alpha, e.g.
           rgb(var(--brand-ink-rgb) / 0.12). A settings screen that changes
           --brand MUST set --brand-rgb in the same write, or a shadow keeps
           the old hue while everything around it moves. */
        --brand-rgb: 91 76 189;
        --brand-ink-rgb: 79 65 168;
        --brand-hover-rgb: 74 61 163;
        --brand-deep-rgb: 69 56 151;
        --brand-deepest-rgb: 60 48 132;
        --brand-soft-rgb: 169 155 240;
        --accent-rgb: 226 71 1;
        --accent-hover-rgb: 198 61 1;
        --accent-strong-rgb: 178 54 0;


        --primary: var(--brand);
        --dark: var(--brand-ink);
        --gold: var(--accent);
        /* ── Configurable from Settings > Reservation Form (2026-08-23) ──
           These four carry the bundled defaults. applyReserveAppearance()
           overwrites them at runtime from app_settings.reserve_appearance.
           Leaving the real values here means the page renders correctly
           before the fetch lands, and stays correct if it never does. */
        --rf-bg-image: url("assets/background-generic.jpg");
        --rf-glass: rgb(var(--brand-ink-rgb) / 0.6);
        /* The page colour when Background style is "solid". Set from the same
           panel colour the glass uses, at full strength. */
        --rf-solid: rgb(var(--brand-ink-rgb));
        --rf-logo-max-h: 72px;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: #101820;
        color: #f2efe9;
        -webkit-font-smoothing: antialiased;
      }
      .bg-photo {
        position: fixed;
        inset: -24px;
        background: var(--rf-bg-image) center / cover no-repeat;
        filter: brightness(0.85) saturate(0.95);
        z-index: -2;
      }
      .bg-tint {
        position: fixed;
        inset: 0;
        /* dawn nuance: cool indigo wash, lighter at mid, deeper at edges */
        background: linear-gradient(
          180deg,
          rgba(24, 34, 66, 0.5) 0%,
          rgba(40, 56, 94, 0.3) 45%,
          rgba(18, 28, 54, 0.55) 100%
        );
        z-index: -1;
      }
      /* Solid background mode (Settings > Reservation Form > Background
         style). The photo layer is taken out of the picture rather than
         covered over, and the tint layer becomes the flat colour: a client
         who has no good photograph of the room gets a page that looks
         deliberate instead of one that looks like a photo failed to load.

         An attribute on <html> rather than another custom property, because
         this switches rules on and off rather than swapping a value. It is
         set by applyReserveAppearance(), and the bundled default is the
         photo, so the page renders the way it always did before the fetch
         lands and if it never does. */
      :root[data-rf-bg="solid"] .bg-photo {
        display: none;
      }
      :root[data-rf-bg="solid"] .bg-tint {
        background: var(--rf-solid);
      }
      /* Panel colour glass over a page of the SAME colour is invisible, so in
         solid mode the card becomes a solid light sheet. The blur goes too:
         there is nothing behind it left to blur. */
      :root[data-rf-bg="solid"] body {
        background: var(--rf-solid);
        color: #272334;
      }
      :root[data-rf-bg="solid"] .card {
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border-color: rgba(255, 255, 255, 0.65);
        border-radius: 22px;
        box-shadow: 0 18px 46px rgba(35, 27, 74, 0.2);
      }
      :root[data-rf-bg="solid"] h1,
      :root[data-rf-bg="solid"] .summary strong {
        color: #252035;
      }
      :root[data-rf-bg="solid"] .note,
      :root[data-rf-bg="solid"] .back {
        color: rgba(37, 32, 53, 0.68);
      }
      :root[data-rf-bg="solid"] .summary {
        background: #f7f4ff;
        border-color: rgba(91, 76, 189, 0.24);
        color: rgba(37, 32, 53, 0.78);
      }
      :root[data-rf-bg="solid"] .check {
        box-shadow: 0 10px 20px rgba(35, 27, 74, 0.22);
      }
      :root[data-rf-bg="solid"] .btn-wa {
        border-radius: 12px;
        box-shadow: 0 10px 20px rgba(35, 27, 74, 0.18);
      }
      :root[data-rf-bg="solid"] .lang-switch {
        background: rgba(255, 255, 255, 0.88);
        border-color: rgba(255, 255, 255, 0.54);
      }
      :root[data-rf-bg="solid"] .lang-switch button {
        color: rgba(37, 32, 53, 0.62);
      }
      :root[data-rf-bg="solid"] .lang-switch button[aria-pressed="true"] {
        color: #fff;
      }
      :root[data-rf-bg="solid"] .logo-plain img {
        filter: none;
      }
      :root[data-rf-bg="solid"] .foot {
        color: rgba(255, 255, 255, 0.84);
        text-shadow: none;
      }
      /* Same switch as the booking page, same place. A guest lands here one
         tap after that form and must not have to hunt for it again. */
      .lang-switch {
        align-self: flex-end;
        display: flex;
        gap: 4px;
        margin-bottom: 10px;
        padding: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
      }
      .lang-switch button {
        font: inherit;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        padding: 5px 11px;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        color: rgba(242, 239, 233, 0.75);
        background: transparent;
      }
      .lang-switch button[aria-pressed="true"] {
        background: var(--primary);
        color: #fff;
      }
      .wrap {
        max-width: 430px;
        margin: 0 auto;
        padding: 28px 20px 40px;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      .logo-plain {
        align-self: center;
        margin-bottom: 26px;
      }
      .logo-plain img {
        display: block;
        /* The old rule was height:120px with width:auto, which is fine for a
           square mark and disastrous for a wide wordmark: the logo grew past
           the viewport. Cap BOTH axes and let whichever limit bites first
           win, so any client's logo lands at a sane size whatever its shape. */
        height: auto;
        width: auto;
        max-height: var(--rf-logo-max-h);
        max-width: min(260px, 62vw);
        filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.35));
      }
      .card {
        /* navy glass (var(--brand-ink) base), colour and opacity set in Settings */
        background: var(--rf-glass);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 18px;
        padding: 34px 22px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        text-align: center;
      }
      .check {
        width: 74px;
        height: 74px;
        margin: 0 auto 18px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--primary), var(--dark));
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 26px rgb(var(--brand-rgb) / 0.4);
        animation: pop 0.45s cubic-bezier(0.2, 1.6, 0.4, 1);
      }
      @keyframes pop {
        0% {
          transform: scale(0.4);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      .check svg {
        width: 36px;
        height: 36px;
      }
      h1 {
        font-family: "Montserrat", sans-serif;
        font-weight: 400;
        font-size: 22px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #fff;
        margin-bottom: 10px;
      }
      .note {
        font-size: 14.5px;
        line-height: 1.65;
        color: #c6cdd4;
        margin-bottom: 8px;
      }
      .summary {
        margin: 20px auto 4px;
        padding: 14px 16px;
        border: 1px dashed rgb(var(--accent-rgb) / 0.45);
        border-radius: 12px;
        font-size: 14px;
        color: #e8dfc9;
        display: none;
      }
      .summary strong {
        color: #fff;
        font-weight: 600;
      }
      .btn-wa {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        margin-top: 22px;
        border: none;
        border-radius: 999px;
        padding: 15px;
        font-family: inherit;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        background: #1faa53;
        text-decoration: none;
        box-shadow: 0 6px 20px rgba(31, 170, 83, 0.35);
        transition: transform 0.1s;
      }
      .btn-wa:active {
        transform: scale(0.985);
      }
      .btn-wa svg {
        width: 22px;
        height: 22px;
      }
      .back {
        display: block;
        text-align: center;
        margin-top: 18px;
        font-size: 13.5px;
        color: #9fb4c6;
        text-decoration: none;
      }
      .back:active {
        color: #fff;
      }
      .foot {
        text-align: center;
        font-size: 12px;
        font-weight: 600;
        color: #c9d2da;
        margin-top: auto;
        padding-top: 30px;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="bg-photo"></div>
    <div class="bg-tint"></div>

    <div class="wrap">
      <div class="lang-switch" id="lang-switch">
        <button type="button" data-lang-btn="id" aria-pressed="true" onclick="setGuestLanguage('id')">
          ID
        </button>
        <button type="button" data-lang-btn="en" aria-pressed="false" onclick="setGuestLanguage('en')">
          EN
        </button>
      </div>
      <div class="logo-plain">
        <img
          data-brand-logo="full"
          src="assets/full-logo.png"
          alt="Restoran"
        />
      </div>

      <div class="card">
        <div class="check">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fff"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 6L9 17l-5-5" />
          </svg>
        </div>
        <h1 id="created-title" data-i18n>Reservation Created</h1>
        <!-- Rewritten in place for a waitlisted booking. The default wording
             below is a confirmation, and a guest whose booking is still waiting
             on a human must not read it. -->
        <div id="waitlist-note" class="summary" style="display: none"></div>
        <div id="deposit-note" class="summary" style="display: none"></div>
        <!-- One paragraph, not two. This page used to print the sentence in
             Indonesian and then again in English underneath, because there was
             no way to know which the guest read. There is now. -->
        <p class="note" id="created-note" data-i18n>
          Our staff will contact you shortly, or you can add a more personal
          touch by tapping the button below to reach us.
        </p>

        <div id="res-summary" class="summary"></div>

        <a
          id="btn-wa"
          class="btn-wa"
          href="https://wa.me/62XXXXXXXXXX"
          target="_blank"
          rel="noopener"
        >
          <svg viewBox="0 0 24 24" fill="#fff">
            <path
              d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2zm5.4 14.1c-.2.7-1.3 1.3-1.9 1.4-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-2.9-1.3-4.8-4.2-5-4.4-.1-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.4.2.5.7 1.9.8 2 .1.1.1.3 0 .5l-.4.6c-.1.2-.3.3-.1.6.1.3.6 1.1 1.4 1.8 1 .9 1.8 1.2 2.1 1.3.3.1.4.1.6-.1l.7-.9c.2-.3.4-.2.6-.1l1.9.9c.2.1.4.2.5.3 0 .1 0 .5-.3 1.1z"
            />
          </svg>
          <span data-i18n>Chat with us on WhatsApp</span>
        </a>

        <a class="back" href="reserve.html"
          >&larr; <span data-i18n>Make another reservation</span></a
        >
      </div>

      <p class="foot">Serving stories on every plate since 2023</p>
    </div>

    <script src="js/guest-i18n.js"></script>
    <script>
      // Show a small summary + prefill the WhatsApp message with the
      // reservation details (handed over via sessionStorage — no PII in the URL).
      // A function, and called again on every language switch, because all of
      // it is composed in JavaScript: the walker in guest-i18n.js only reaches
      // the static labels.
      function renderCreated() {
        const raw = sessionStorage.getItem("bhPublicRes");
        if (!raw) return;
        {
          const r = JSON.parse(raw);
          const d = new Date(r.date + "T00:00:00");
          const dateLabel = d.toLocaleDateString(
            GUEST_LANG === "id" ? "id-ID" : "en-GB",
            {
              weekday: "long",
              day: "numeric",
              month: "long",
              year: "numeric",
            },
          );
          // ===== Waitlist =====
          // `ok: true` from the booking function does NOT mean confirmed. A
          // party outside the area's rules is stored as a request, and telling
          // that guest they have a table is the worst outcome this flow has.
          if (r.waitlisted) {
            const why =
              {
                over_capacity: "Your party is larger than the area you chose",
                below_min_pax:
                  "Your party is below the minimum for the area you chose",
                over_max_pax: "Your party is a large one",
              }[r.waitlist_reason] || "We need to review your request";
            // The heading swaps its SOURCE string rather than its text, so the
            // walker keeps translating it on every later switch instead of
            // putting "Reservation Created" back over a request.
            const title = document.getElementById("created-title");
            title.dataset.i18nEn = "Request Sent";
            title.textContent = gt("Request Sent");
            const note = document.getElementById("created-note");
            note.removeAttribute("data-i18n"); // composed below, not walked
            note.innerHTML =
              "<strong>" +
              gt("This is not a confirmed reservation yet.") +
              "</strong> " +
              gtf(
                "{reason}, so our staff will review it and let you know on WhatsApp. Please do not come in before we confirm.",
                { reason: gt(why) },
              );
            const wl = document.getElementById("waitlist-note");
            wl.textContent = gt("Status: waiting for staff to confirm");
            wl.style.display = "block";
          } else if (r.deposit_required && r.deposit_expected) {
            // Only a booking that was actually accepted is asked for money.
            const dep = document.getElementById("deposit-note");
            dep.innerHTML =
              gt("Deposit (DP)") +
              " <strong>Rp " +
              Number(r.deposit_expected).toLocaleString("id-ID") +
              "</strong><br>" +
              gt(
                "We will send the payment details on WhatsApp. Your reservation is held until the deposit arrives.",
              );
            dep.style.display = "block";
          }

          const box = document.getElementById("res-summary");
          box.innerHTML =
            "<strong>" +
            String(r.name).replace(/[<>&]/g, "") +
            "</strong><br>" +
            dateLabel +
            " &middot; " +
            r.time +
            " &middot; " +
            r.pax +
            " pax" +
            (r.area ? " &middot; " + String(r.area).replace(/[<>&]/g, "") : "");
          box.style.display = "block";

          // The guest is the one sending this, so it goes in the language
          // they are reading.
          const wa = document.getElementById("btn-wa");
          const msg = gtf(
            "Reservation for {name} on {date} at {time}. Hello, I have something to add to my reservation.",
            { name: r.name, date: dateLabel, time: r.time },
          );
          wa.href = wa.href.split("?")[0] + "?text=" + encodeURIComponent(msg);
        }
      }

      // Language before the summary, so it is composed once, in the right one.
      initGuestLanguageSync();
      function onGuestLanguageChange() {
        try {
          renderCreated();
        } catch (_) {
          /* a broken summary must not take the switch down with it */
        }
      }
      try {
        renderCreated();
      } catch (_) {
        /* page still works without the summary */
      }
    </script>

    <!-- Branding only. This page is otherwise pure client-side (it reads the
         booking summary from sessionStorage), but it carries the restaurant's
         logo, and that logo now lives in the database so one build can serve
         every client. config.js supplies the Supabase client and the shared
         initBranding() helper; both calls are guarded so the page still works
         if either script fails to load. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script>
      if (typeof initBranding === "function") initBranding();
      // Same backdrop, glass and logo size as the booking page it follows.
      // A guest who books and lands here must not watch the restaurant change
      // colour between two consecutive screens.
      if (typeof initReserveAppearance === "function") initReserveAppearance();

      // config.js sets its own CURRENT_LANG from the STAFF browser's key when
      // it loads, which on a guest's phone is simply absent. Re-applying puts
      // t() and the month names back in step with the guest's choice, and
      // then the restaurant's own setting lands on top.
      (async function guestLanguage() {
        applyGuestLanguage(GUEST_LANG);
        try {
          const { data } = await db
            .from("app_settings")
            .select("value")
            .eq("key", "reservation_form")
            .maybeSingle();
          applyGuestLanguageSetting(data?.value || {});
        } catch (_) {
          /* the guest's own choice, or the cached hint, still stands */
        }
      })();
    </script>
  </body>
</html>
